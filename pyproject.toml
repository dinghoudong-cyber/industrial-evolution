[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-evolution"
version = "0.1.0"
description = "工业漂移数据流上的受控模型自进化框架"
readme = "README.md"
authors = [{ name = "会赢的，对不队（北京印刷学院）" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.14",
  "scikit-learn>=1.6",
  "joblib>=1.4",
  "pydantic>=2.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff==0.14.14"]
swanlab = ["swanlab>=0.10.4,<1.0"]
llm = ["openai>=1.0"]

[project.scripts]
industrial-evolution = "industrial_evolution.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
