# XJTU-SY 单轴承全寿命离线 RUL 回归起点配置。
# RUL = 本轴承最后文件序号 - 当前文件序号，单位分钟；依赖已知完整寿命终点，
# 不代表现场在线时可见的标签。参数须在官方评分规则和静态基线明确后重新校准。
seed: 42
task_type: regression

stream:
  initial_samples: 100
  window_size: 50
  n_windows: 48
  n_features: 12
  gradual_drift_start: 6
  abrupt_drift_start: 12
  label_noise: 0.0

monitoring:
  psi_threshold: 0.18
  ks_threshold: 0.18
  performance_drop_threshold: 5.0
  label_shift_threshold: 0.12
  consecutive_windows: 2
  reference_update_rate: 0.15

policy:
  cooldown_windows: 2
  rollback_patience: 2
  rollback_drop: 10.0

training:
  replay_capacity: 4000
  recent_fraction: 0.65
  max_replay_samples: 1500
  holdout_fraction: 0.30

validation:
  min_improvement: 1.0
  max_historical_drop: 5.0
  guard_samples: 800

budget:
  max_updates: 8
  max_training_seconds: 240.0
  max_labels: 10000
  max_tokens: 0

tracking:
  run_root: "runs"
  enable_swanlab: false
  swanlab_project: "industrial_evolution"
  swanlab_mode: "online"
  swanlab_tags: ["industrial-evolution", "xjtu-sy"]
  swanlab_upload_artifacts: true
  swanlab_artifact_max_mb: 64

llm:
  enabled: false
  provider: openai_compatible
  model: "LOCAL_MODEL_ID"
  base_url: "http://127.0.0.1:8000/v1"
  api_key_env: "LOCAL_LLM_API_KEY"
  api_key_required: false
  json_mode: true
  temperature: 0.0
  timeout_seconds: 20.0
  max_retries: 1
  max_output_tokens: 160
  max_tokens_per_call: 800
  max_calls: 8
  min_confidence: 0.65
  call_cooldown_windows: 2
